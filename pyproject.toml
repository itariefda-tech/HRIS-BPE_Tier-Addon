[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hris-bpe-tier-addons"
version = "0.1.0"
description = "Phase 1 backend foundation for HRIS-BPE Tier Addons."
readme = "README_DEV.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "sqlalchemy>=2.0.40,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "PyJWT>=2.10.1,<3.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "psycopg[binary]>=3.2.9,<4.0.0",
  "Werkzeug>=3.1.0,<4.0.0",
]

[project.scripts]
hris-bpe-dev = "hris_bpe.dev:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1.0.0",
  "pytest>=8.4.0,<9.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
